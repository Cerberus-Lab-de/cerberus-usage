[package]
name = "cerberus-usage"
version = "1.0.0"
edition = "2024"

[lib]
name = "cerberus_usage"
path = "src/lib.rs"

[[bin]]
name = "cerberus-usage"
path = "src/main.rs"

[[bin]]
name = "sign-release"
path = "src/bin/sign-release.rs"

[dependencies]
eframe = "0.37"
tray-icon = "0.26"
keyring = "4"
ureq = { version = "3", features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
memchr = "2"
rfd = "0.17"
ed25519-dalek = "3"
sha2 = "0.11"
semver = { version = "1", features = ["serde"] }
zeroize = "1"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"
